<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锁组件设计方案 - 预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .design-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .design-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(168, 85, 247, 0.2);
        }

        .design-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .design-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
        }

        .design-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            position: relative;
        }

        .design-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ========== 方案A: 水晶棱镜锁 ========== */
        .crystal-lock {
            position: relative;
            width: 140px;
            height: 140px;
            cursor: pointer;
        }

        .crystal-lock .lock-body {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: 
                linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4c1d95 70%, #2e1065 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            border: 2px solid rgba(168, 85, 247, 0.3);
            box-shadow: 
                0 0 40px rgba(168, 85, 247, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.1),
                inset 0 -5px 15px rgba(0, 0, 0, 0.3);
        }

        .crystal-lock:hover .lock-body {
            box-shadow: 
                0 0 60px rgba(168, 85, 247, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.15),
                inset 0 -5px 15px rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }

        .crystal-lock .prism {
            width: 50px;
            height: 60px;
            position: relative;
        }

        .crystal-lock .prism::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(196, 181, 253, 0.9) 0%,
                rgba(168, 85, 247, 0.8) 25%,
                rgba(236, 72, 153, 0.7) 50%,
                rgba(59, 130, 246, 0.8) 75%,
                rgba(168, 85, 247, 0.9) 100%
            );
            clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
            animation: shimmer 3s ease-in-out infinite;
        }

        .crystal-lock .prism::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            filter: blur(2px);
        }

        @keyframes shimmer {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
            50% { filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.8)); }
        }

        .crystal-lock .aura-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(168, 85, 247, 0.2);
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { opacity: 1; transform: scale(0.95); }
            100% { opacity: 0; transform: scale(1.15); }
        }

        /* ========== 方案B: 量子漩涡锁 ========== */
        .quantum-lock {
            position: relative;
            width: 160px;
            height: 160px;
            cursor: pointer;
        }

        .quantum-lock .orbit {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed rgba(34, 211, 238, 0.3);
            animation: rotate 20s linear infinite;
        }

        .quantum-lock .orbit::before,
        .quantum-lock .orbit::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22d3ee;
            box-shadow: 0 0 12px #22d3ee, 0 0 24px rgba(34, 211, 238, 0.5);
        }

        .quantum-lock .orbit::before {
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .quantum-lock .orbit::after {
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            background: #a855f7;
            box-shadow: 0 0 12px #a855f7, 0 0 24px rgba(168, 85, 247, 0.5);
        }

        .quantum-lock .orbit-2 {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 1px dashed rgba(168, 85, 247, 0.3);
            animation: rotate 15s linear infinite reverse;
        }

        .quantum-lock .orbit-2::before {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
            top: 50%;
            right: -3px;
            transform: translateY(-50%);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .quantum-lock .core {
            position: absolute;
            inset: 35px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                #e0e7ff 0%, 
                #a855f7 30%, 
                #4c1d95 60%, 
                #1e1b4b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 40px rgba(168, 85, 247, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .quantum-lock:hover .core {
            box-shadow: 
                0 0 60px rgba(168, 85, 247, 0.7),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }

        .quantum-lock .lock-icon {
            width: 32px;
            height: 32px;
            position: relative;
        }

        .quantum-lock .lock-icon::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .quantum-lock .lock-icon::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid #fff;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }

        /* ========== 方案C: 液态金属锁 ========== */
        .liquid-lock {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
        }

        .liquid-lock .container {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(145deg, 
                #2d2d44 0%, 
                #1a1a2e 50%, 
                #0f0f1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.1),
                inset 0 -5px 10px rgba(0, 0, 0, 0.3);
        }

        .liquid-lock .metal-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                transparent 0%,
                rgba(192, 192, 220, 0.1) 20%,
                rgba(192, 192, 220, 0.3) 40%,
                rgba(192, 192, 220, 0.1) 60%,
                transparent 80%
            );
            animation: metalMove 4s linear infinite;
        }

        @keyframes metalMove {
            0% { transform: translateX(-100%) rotate(135deg); }
            100% { transform: translateX(100%) rotate(135deg); }
        }

        .liquid-lock .lock-symbol {
            position: relative;
            z-index: 2;
            width: 55px;
            height: 65px;
        }

        .liquid-lock .lock-body-shape {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(145deg, #c0c0dc 0%, #8b8ba7 50%, #5a5a78 100%);
            border-radius: 6px 6px 8px 8px;
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.4),
                inset 0 -2px 3px rgba(0, 0, 0, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .liquid-lock .lock-body-shape::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .liquid-lock .lock-shackle {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 35px;
            border: 6px solid;
            border-color: transparent transparent #c0c0dc #c0c0dc;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            transition: transform 0.5s ease;
        }

        .liquid-lock:hover .lock-shackle {
            transform: translateX(-50%) rotate(-25deg);
        }

        .liquid-lock:hover .container {
            box-shadow: 
                0 15px 50px rgba(0, 0, 0, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.15),
                inset 0 -5px 10px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(192, 192, 220, 0.3);
        }

        .liquid-lock .highlight {
            position: absolute;
            top: 5px;
            left: 15px;
            width: 40px;
            height: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
            border-radius: 50%;
            z-index: 3;
        }

        /* ========== 方案D: 霓虹电路锁 ========== */
        .neon-lock {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
        }

        .neon-lock .bg-circle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, 
                rgba(10, 20, 40, 0.9) 0%, 
                rgba(5, 10, 25, 0.95) 100%);
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 
                inset 0 0 30px rgba(0, 255, 255, 0.1),
                0 0 20px rgba(0, 255, 255, 0.2);
        }

        .neon-lock .circuit-lines {
            position: absolute;
            inset: 0;
        }

        .neon-lock .circuit-lines::before,
        .neon-lock .circuit-lines::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 255, 0.6) 50%, 
                transparent 100%);
            height: 1px;
            animation: circuitFlow 2s ease-in-out infinite;
        }

        .neon-lock .circuit-lines::before {
            top: 30%;
            left: 15px;
            right: 15px;
        }

        .neon-lock .circuit-lines::after {
            bottom: 25%;
            left: 25px;
            right: 25px;
            animation-delay: 1s;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 0, 255, 0.6) 50%, 
                transparent 100%);
        }

        @keyframes circuitFlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .neon-lock .chip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, 
                #0a1628 0%, 
                #0d1f3c 50%, 
                #0a1628 100%);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .neon-lock:hover .chip {
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.5),
                inset 0 0 15px rgba(0, 255, 255, 0.2);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .neon-lock .lock-icon-neon {
            width: 28px;
            height: 34px;
            position: relative;
        }

        .neon-lock .lock-icon-neon::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 18px;
            background: #0ff;
            border-radius: 2px;
            box-shadow: 
                0 0 8px #0ff,
                0 0 16px rgba(0, 255, 255, 0.5);
        }

        .neon-lock .lock-icon-neon::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 14px;
            border: 3px solid #0ff;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }

        .neon-lock .pins {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 30px;
            background: repeating-linear-gradient(
                180deg,
                rgba(0, 255, 255, 0.6) 0px,
                rgba(0, 255, 255, 0.6) 2px,
                transparent 2px,
                transparent 4px
            );
        }

        .neon-lock .pins-left { left: 15px; }
        .neon-lock .pins-right { right: 15px; }

        .neon-lock .glow-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f00;
            box-shadow: 0 0 8px #f00;
            top: 25px;
            right: 30px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ========== 解锁动画状态 ========== */
        .design-card.unlocked .crystal-lock .lock-body {
            background: linear-gradient(135deg, #0e7490 0%, #22d3ee 50%, #0891b2 100%);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 
                0 0 50px rgba(34, 211, 238, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.15);
        }

        .design-card.unlocked .crystal-lock .prism::before {
            background: linear-gradient(
                135deg,
                rgba(165, 243, 252, 0.9) 0%,
                rgba(34, 211, 238, 0.8) 50%,
                rgba(6, 182, 212, 0.9) 100%
            );
        }

        .design-card.unlocked .quantum-lock .core {
            background: radial-gradient(circle at 30% 30%, 
                #e0f7fa 0%, 
                #22d3ee 30%, 
                #0e7490 60%, 
                #164e63 100%);
        }

        .design-card.unlocked .neon-lock .chip {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .design-card.unlocked .neon-lock .lock-icon-neon::before {
            background: #a855f7;
            box-shadow: 0 0 8px #a855f7, 0 0 16px rgba(168, 85, 247, 0.5);
        }

        .design-card.unlocked .neon-lock .lock-icon-neon::after {
            border-color: #a855f7;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
        }

        .status-text {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
        }

        .design-card.unlocked .status-text {
            color: #22d3ee;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 锁组件设计方案</h1>
        <p>点击任意方案查看交互效果，选出你最喜欢的设计风格</p>
    </div>

    <div class="designs-grid">
        <!-- 方案A: 水晶棱镜锁 -->
        <div class="design-card" id="card-a">
            <div class="design-title">
                方案 A: 水晶棱镜
                <span class="design-tag">优雅</span>
            </div>
            <div class="design-desc">
                多层渐变棱镜效果，光线折射般的光泽流动。
                紫色系主调，悬浮微动效，适合现代简洁风格。
            </div>
            <div class="preview-area">
                <div class="crystal-lock" onclick="toggleLock('card-a')">
                    <div class="aura-ring"></div>
                    <div class="lock-body">
                        <div class="prism"></div>
                    </div>
                    <span class="status-text">点击解锁</span>
                </div>
            </div>
            <div class="design-buttons">
                <button class="btn btn-primary" onclick="selectDesign('A')">选择此方案</button>
                <button class="btn btn-secondary" onclick="toggleLock('card-a')">预览效果</button>
            </div>
        </div>

        <!-- 方案B: 量子漩涡锁 -->
        <div class="design-card" id="card-b">
            <div class="design-title">
                方案 B: 量子漩涡
                <span class="design-tag">科技</span>
            </div>
            <div class="design-desc">
                双轨道粒子环绕中心旋转，量子物理视觉风格。
                青/紫双色轨道，适合技术向页面，动感十足。
            </div>
            <div class="preview-area">
                <div class="quantum-lock" onclick="toggleLock('card-b')">
                    <div class="orbit"></div>
                    <div class="orbit-2"></div>
                    <div class="core">
                        <div class="lock-icon"></div>
                    </div>
                    <span class="status-text">点击解锁</span>
                </div>
            </div>
            <div class="design-buttons">
                <button class="btn btn-primary" onclick="selectDesign('B')">选择此方案</button>
                <button class="btn btn-secondary" onclick="toggleLock('card-b')">预览效果</button>
            </div>
        </div>

        <!-- 方案C: 液态金属锁 -->
        <div class="design-card" id="card-c">
            <div class="design-title">
                方案 C: 液态金属
                <span class="design-tag">质感</span>
            </div>
            <div class="design-desc">
                真实金属材质模拟，光泽流动性动画。
                立体弹开锁扣动效，hover 时锁扣抬起，拟物风格。
            </div>
            <div class="preview-area">
                <div class="liquid-lock" onclick="toggleLock('card-c')">
                    <div class="container">
                        <div class="metal-shine"></div>
                        <div class="lock-symbol">
                            <div class="lock-shackle"></div>
                            <div class="lock-body-shape"></div>
                        </div>
                        <div class="highlight"></div>
                    </div>
                    <span class="status-text">点击解锁</span>
                </div>
            </div>
            <div class="design-buttons">
                <button class="btn btn-primary" onclick="selectDesign('C')">选择此方案</button>
                <button class="btn btn-secondary" onclick="toggleLock('card-c')">预览效果</button>
            </div>
        </div>

        <!-- 方案D: 霓虹电路锁 -->
        <div class="design-card" id="card-d">
            <div class="design-title">
                方案 D: 霓虹电路
                <span class="design-tag">赛博</span>
            </div>
            <div class="design-desc">
                电路板风格设计，霓虹光效脉动。
                青/紫双色切换，带指示灯闪烁，适合极客风格。
            </div>
            <div class="preview-area">
                <div class="neon-lock" onclick="toggleLock('card-d')">
                    <div class="bg-circle"></div>
                    <div class="circuit-lines"></div>
                    <div class="pins pins-left"></div>
                    <div class="pins pins-right"></div>
                    <div class="chip">
                        <div class="lock-icon-neon"></div>
                    </div>
                    <div class="glow-dot"></div>
                    <span class="status-text">点击解锁</span>
                </div>
            </div>
            <div class="design-buttons">
                <button class="btn btn-primary" onclick="selectDesign('D')">选择此方案</button>
                <button class="btn btn-secondary" onclick="toggleLock('card-d')">预览效果</button>
            </div>
        </div>
    </div>

    <script>
        function toggleLock(cardId) {
            const card = document.getElementById(cardId);
            card.classList.toggle('unlocked');
            
            const statusText = card.querySelector('.status-text');
            if (card.classList.contains('unlocked')) {
                statusText.textContent = '✨ 已解锁 · 查看技术栈';
                statusText.style.color = getComputedStyle(document.querySelector(`#${cardId} .preview-area`)).color || '#22d3ee';
            } else {
                statusText.textContent = '点击解锁';
                statusText.style.color = '#64748b';
            }
        }

        function selectDesign(option) {
            alert(`方案 ${option} 已选择！\n\n我将根据此方案重新设计锁组件，\n请告诉我你是否确认这个选择，或者需要我继续优化这个设计。`);
        }

        // 初始化状态文字颜色
        document.querySelectorAll('.status-text').forEach(el => {
            el.style.color = '#64748b';
        });
    </script>
</body>
</html>
