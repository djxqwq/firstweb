name: Deploy Site to Server

# 触发条件：push 到 main 分支（仅在前端/后端/部署配置变更时）
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "===== 拉取最新代码 ====="
            cd ~/firstweb
            git pull origin main

            echo "===== 重建 & 重启容器 ====="
            # 优先直接执行，失败则用 sudo（兼容未加入 docker 组的情况）
            if docker compose up -d --build 2>/dev/null; then
              :
            else
              sudo docker compose up -d --build
            fi

            echo "===== 清理旧镜像 ====="
            docker image prune -f 2>/dev/null || sudo docker image prune -f

            echo "===== 健康检查 ====="
            sleep 5
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "✓ 后端正常"
            else
              echo "✗ 后端异常"
              docker logs blog-backend --tail 20 2>/dev/null || sudo docker logs blog-backend --tail 20
            fi

            echo "===== 部署完成: $(date) ====="
